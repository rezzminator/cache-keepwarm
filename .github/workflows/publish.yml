name: publish

# Merging the develop -> main pull request is the release: `publish` tags the
# merge commit cache-keepwarm--v{version} and creates the GitHub release from the
# version's CHANGELOG section. ci.yml gates the pull request before the merge;
# this re-runs no test. No tag is pushed by hand.
on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read

jobs:
  publish:
    if: github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: The tag is new
        id: tag
        run: |
          version="$(node -p 'require("./package.json").version')"
          tag="cache-keepwarm--v$version"
          rc=0
          git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null || rc=$?
          case "$rc" in
            0) echo "::error::tag $tag already exists"; exit 1 ;;
            2) ;;
            *) echo "::error::tag lookup for $tag failed (git ls-remote exit $rc)"; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Publish changelog section
        env:
          GH_TOKEN: ${{ github.token }}
          version: ${{ steps.tag.outputs.version }}
          tag: ${{ steps.tag.outputs.tag }}
        run: |
          awk -v heading="## [$version]" 'index($0,heading)==1 {p=1;next} p && /^## / {exit} p {print}' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md"
          gh release create "$tag" --target "${{ github.event.pull_request.merge_commit_sha }}" --title "cache-keepwarm $version" --notes-file "$RUNNER_TEMP/notes.md"
