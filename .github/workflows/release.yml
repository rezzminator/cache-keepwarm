name: release
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm install --global @anthropic-ai/claude-code@2.1.302
      - run: make gate
  release:
    if: github.event_name == 'pull_request' && github.base_ref == 'main' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: make release
  publish:
    if: github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: The tag is new
        id: tag
        run: |
          version="$(node -p 'require("./package.json").version')"
          tag="cache-keepwarm--v$version"
          rc=0
          git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null || rc=$?
          case "$rc" in
            0) echo "::error::tag $tag already exists"; exit 1 ;;
            2) ;;
            *) echo "::error::tag lookup for $tag failed (git ls-remote exit $rc)"; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Publish changelog section
        env:
          GH_TOKEN: ${{ github.token }}
          version: ${{ steps.tag.outputs.version }}
          tag: ${{ steps.tag.outputs.tag }}
        run: |
          awk -v heading="## [$version]" 'index($0,heading)==1 {p=1;next} p && /^## / {exit} p {print}' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md"
          gh release create "$tag" --target "${{ github.event.pull_request.merge_commit_sha }}" --title "cache-keepwarm $version" --notes-file "$RUNNER_TEMP/notes.md"
