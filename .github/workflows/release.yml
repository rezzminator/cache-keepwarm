name: Release
on:
  push:
    tags: ['cache-keepwarm--v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run release:check
      - name: Require release-only main ancestry
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Publish changelog section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#cache-keepwarm--v}"
          awk -v heading="## [$version]" 'index($0,heading)==1 {p=1;next} p && /^## / {exit} p {print}' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "cache-keepwarm $version" --notes-file "$RUNNER_TEMP/notes.md"
